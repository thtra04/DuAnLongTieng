services:
  vsub:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - vsub-data:/data
    environment:
      - VSUB_DATA_DIR=/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  vsub-data:
  redis-data:
