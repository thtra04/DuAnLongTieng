plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vsubstudio.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.vsubstudio.app'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Ký bằng khoá debug để file APK cài thẳng được (đồ án, không đưa lên Google Play)
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
